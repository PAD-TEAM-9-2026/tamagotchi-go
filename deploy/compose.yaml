      BROKER_URL: https://message-broker:5010
      BROKER_CONTEXT_JWKS_PATH: /run/secrets/broker-context-jwks.json
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      TLS_CERT_PATH: /run/secrets/tls/monster-raid.crt
      TLS_KEY_PATH: /run/secrets/tls/monster-raid.key
    volumes:
      - monster-raid-logs:/logs/monster-raid
      - ./secrets/gateway-assertion-jwks.json:/run/secrets/gateway-assertion-jwks.json:ro
      - ./secrets/broker-context-jwks.json:/run/secrets/broker-context-jwks.json:ro
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/monster-raid.crt:/run/secrets/tls/monster-raid.crt:ro
      - ./secrets/tls/monster-raid.key:/run/secrets/tls/monster-raid.key:ro
    healthcheck: *ready-dotnet-8080

  gateway:
    image: victoriamutruc/gateway:4.0.1@sha256:95b977df4c8041b8779e339960fef1224708dfeca38750d70036801621992012
    restart: unless-stopped
    pull_policy: always
    <<: *logs
    depends_on:
      service-discovery:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    environment:
      PORT: 3000
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      LOG_DIR: /logs
      GATEWAY_ASSERTION_PRIVATE_KEY_PATH: /run/secrets/gateway-assertion.pem
      GATEWAY_ASSERTION_KEY_ID: ${GATEWAY_ASSERTION_KEY_ID:?set GATEWAY_ASSERTION_KEY_ID in .env (run gateway/generate-keys.sh)}
      GATEWAY_ASSERTION_JWKS_PATH: /run/secrets/gateway-assertion-jwks.json
      SERVICE_DISCOVERY_URL: http://service-discovery:3009
      USER_MANAGEMENT_URL: http://user-management:3001
