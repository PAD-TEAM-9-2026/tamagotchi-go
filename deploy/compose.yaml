name: tamagotchi-go

services:
  database:
    image: postgis/postgis:17-3.6-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?set DATABASE_ADMIN_PASSWORD in .env}
      USER_MANAGEMENT_DB_USER: ${USER_MANAGEMENT_DB_USER:-user_management}
      USER_MANAGEMENT_DB_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD:?set USER_MANAGEMENT_DB_PASSWORD in .env}
      USER_MANAGEMENT_DB_NAME: ${USER_MANAGEMENT_DB_NAME:-user_management}
      TAMAGOTCHI_DB_USER: ${TAMAGOTCHI_DB_USER:-tamagotchi}
      TAMAGOTCHI_DB_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD:?set TAMAGOTCHI_DB_PASSWORD in .env}
      TAMAGOTCHI_DB_NAME: ${TAMAGOTCHI_DB_NAME:-tamagotchi}
      BATTLE_DB_USER: ${BATTLE_DB_USER:-battle}
      BATTLE_DB_PASSWORD: ${BATTLE_DB_PASSWORD:?set BATTLE_DB_PASSWORD in .env}
      BATTLE_DB_NAME: ${BATTLE_DB_NAME:-battle}
      GUILD_DB_USER: ${GUILD_DB_USER:-guild}
      GUILD_DB_PASSWORD: ${GUILD_DB_PASSWORD:?set GUILD_DB_PASSWORD in .env}
      GUILD_DB_NAME: ${GUILD_DB_NAME:-guild}
      REGISTRY_DB_USER: ${REGISTRY_DB_USER:-registry}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env}
      REGISTRY_DB_NAME: ${REGISTRY_DB_NAME:-registry}
      MAP_DB_USER: ${MAP_DB_USER:-map}
      MAP_DB_PASSWORD: ${MAP_DB_PASSWORD:?set MAP_DB_PASSWORD in .env}
      MAP_DB_NAME: ${MAP_DB_NAME:-map}
      MONSTER_RAID_DB_USER: ${MONSTER_RAID_DB_USER:-monster_raid}
      MONSTER_RAID_DB_PASSWORD: ${MONSTER_RAID_DB_PASSWORD:?set MONSTER_RAID_DB_PASSWORD in .env}
      MONSTER_RAID_DB_NAME: ${MONSTER_RAID_DB_NAME:-monster_raid}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shared-postgres-data:/var/lib/postgresql/data
      - ./db/init-service-databases.sh:/docker-entrypoint-initdb.d/20_service_databases.sh:ro
      - ./db/user-management/001_init.sql:/service-schema/user-management.sql:ro
      - ./db/battle/001_init.sql:/service-schema/battle.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  user-management:
    image: patriciamoraru/user-management:1.2.0
    platform: linux/amd64
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3001
      ConnectionStrings__UserManagementDb: Host=database;Port=5432;Database=${USER_MANAGEMENT_DB_NAME:-user_management};Username=${USER_MANAGEMENT_DB_USER:-user_management};Password=${USER_MANAGEMENT_DB_PASSWORD}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3001 && printf \"GET /ready HTTP/1.0\\r\\n\\r\\n\" >&3 && timeout 2 cat <&3 | grep -q READY'"]
      interval: 5s
      timeout: 3s
      retries: 10

  tamagotchi:
    image: victoriamutruc/tamagotchi:1.0.0
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3000
      STORAGE: postgres
      DATABASE_URL: postgres://${TAMAGOTCHI_DB_USER:-tamagotchi}:${TAMAGOTCHI_DB_PASSWORD}@database:5432/${TAMAGOTCHI_DB_NAME:-tamagotchi}
      AUTH_MODE: dev
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  guild:
    image: mihaelacatan/guild-service:0.2.0
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      POSTGRES_USER: ${GUILD_DB_USER:-guild}
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD:?set GUILD_DB_PASSWORD in .env}
      POSTGRES_DB: ${GUILD_DB_NAME:-guild}
      AUTH_MODE: dev
    ports:
      - "3004:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    image: mihaelacatan/package-registry-service:0.2.0
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      POSTGRES_USER: ${REGISTRY_DB_USER:-registry}
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env}
      POSTGRES_DB: ${REGISTRY_DB_NAME:-registry}
      AUTH_MODE: dev
      ADMIN_USER_IDS: ${REGISTRY_ADMIN_USER_IDS:-}
    ports:
      - "3005:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  battle:
    image: patriciamoraru/battle:1.2.0
    platform: linux/amd64
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3003
      ConnectionStrings__BattleDb: Host=database;Port=5432;Database=${BATTLE_DB_NAME:-battle};Username=${BATTLE_DB_USER:-battle};Password=${BATTLE_DB_PASSWORD}
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3003 && printf \"GET /ready HTTP/1.0\\r\\n\\r\\n\" >&3 && timeout 2 cat <&3 | grep -q READY'"]
      interval: 5s
      timeout: 3s
      retries: 10

  map:
    image: sergedbs/map:1.0.0
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 8080
      LOCATION_FRESHNESS_SECONDS: 60
      PROXIMITY_THRESHOLD_METRES: 6
      ConnectionStrings__Default: Host=database;Port=5432;Database=${MAP_DB_NAME:-map};Username=${MAP_DB_USER:-map};Password=${MAP_DB_PASSWORD}
    ports:
      - "3006:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /ready HTTP/1.0\\r\\n\\r\\n\" >&3 && timeout 2 cat <&3 | grep -q \"200 OK\"'"]
      interval: 5s
      timeout: 3s
      retries: 10

  monster-raid:
    image: sergedbs/monster-raid:1.0.0
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 8080
      ConnectionStrings__Default: Host=database;Port=5432;Database=${MONSTER_RAID_DB_NAME:-monster_raid};Username=${MONSTER_RAID_DB_USER:-monster_raid};Password=${MONSTER_RAID_DB_PASSWORD}
    ports:
      - "3007:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /ready HTTP/1.0\\r\\n\\r\\n\" >&3 && timeout 2 cat <&3 | grep -q \"200 OK\"'"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification:
    image: victoriamutruc/notification:1.0.0
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3000
      STORAGE: postgres
      DATABASE_URL: postgres://${NOTIFICATION_DB_USER:-notification}:${NOTIFICATION_DB_PASSWORD}@database:5432/${NOTIFICATION_DB_NAME:-notification}
      AUTH_MODE: dev
    ports:
      - "3008:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shared-postgres-data:
