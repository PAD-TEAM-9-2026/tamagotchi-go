# Optional monitoring, layered on compose.yaml: docker compose -f compose.yaml -f compose.monitoring.yaml up -d
# Prometheus scrapes every service replica and the broker on METRICS_PORT; metrics stay internal to Compose.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - shared-prometheus-data:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the private environment}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - shared-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3030}:3000"
    restart: unless-stopped
volumes:
  shared-prometheus-data:
  shared-grafana-data:
