map $http_upgrade $socket_connection {
    default upgrade;
    '' close;
}

log_format guild_socket escape=json '{"service":"guild-socket","method":"$request_method","path":"$uri","status":$status,"upstream":"$upstream_addr","duration_s":$request_time}';
access_log /dev/stdout guild_socket;
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream guild_sockets {
    zone guild_sockets 64k;
    server guild:3000 resolve max_fails=1 fail_timeout=2s;
    server guild-rest:3000 resolve max_fails=1 fail_timeout=2s;
}

server {
    listen 3000;
    server_tokens off;

    location = /health {
        access_log off;
        return 200 'ok';
    }

    location ~ ^/v1/guilds/[0-9a-fA-F-]+/chat$ {
        limit_except GET { deny all; }
        proxy_pass http://guild_sockets;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $socket_connection;
        proxy_set_header Host $host;
        proxy_set_header Authorization '';
        proxy_connect_timeout 1s;
        proxy_read_timeout 75s;
        proxy_send_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;
        proxy_buffering off;
    }

    location / { return 404; }
}
