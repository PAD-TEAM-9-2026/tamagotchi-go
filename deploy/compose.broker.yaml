# Message-broker candidate, layered on compose.yaml without changing it:
#
#   deploy/message-broker/generate-identities.sh
#   docker compose -f compose.yaml -f compose.broker.yaml up --build
#
# It adds the broker with its own database and switches Guild, Package Registry, User
# Management, Battle, Tamagotchi, Notification, Map and the Gateway to the broker. Those services and
# Discovery are built from local source checkouts named in .env (MESSAGE_BROKER_SOURCE,
# SERVICE_DISCOVERY_SOURCE, GUILD_SOURCE, REGISTRY_SOURCE, USER_MANAGEMENT_SOURCE, BATTLE_SOURCE,
# TAMAGOTCHI_SOURCE, NOTIFICATION_SOURCE, MAP_SOURCE, GATEWAY_SOURCE), so the published images and the
# existing volumes stay untouched. User Management publishes its events through the broker; Battle
# keeps publishing through RabbitMQ until its events switch is turned on. Identity rules:
# contracts/identity.md. Startup order: User Management, broker, then the services.

services:
  broker-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${BROKER_DB_USER:-message_broker}
      POSTGRES_PASSWORD: ${BROKER_DB_PASSWORD:?set BROKER_DB_PASSWORD in .env}
      POSTGRES_DB: ${BROKER_DB_NAME:-message_broker}
    volumes:
      - broker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  message-broker:
    build: ${MESSAGE_BROKER_SOURCE:?set MESSAGE_BROKER_SOURCE in .env to a message-broker checkout}
    image: tamagotchi-go/message-broker:candidate
    pull_policy: build
    depends_on:
      broker-database:
        condition: service_healthy
      user-management:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    environment:
      BROKER_LOG_LEVEL: ${BROKER_LOG_LEVEL:-INFO}
      BROKER_DATABASE_URL: jdbc:postgresql://broker-database:5432/${BROKER_DB_NAME:-message_broker}
      BROKER_DATABASE_USER: ${BROKER_DB_USER:-message_broker}
      BROKER_DATABASE_PASSWORD: ${BROKER_DB_PASSWORD}
      BROKER_GRPC_ENABLED: "true"
      BROKER_GRPC_PORT: 5010
      SERVICE_DISCOVERY_URL: http://service-discovery:3009
      USER_MANAGEMENT_URL: http://user-management:3001
      GATEWAY_ASSERTION_JWKS_PATH: /run/secrets/gateway-assertion-jwks.json
      BROKER_CONTEXT_PRIVATE_KEY_PATH: /run/secrets/broker-context.pem
      BROKER_CONTEXT_KEY_ID: ${BROKER_CONTEXT_KEY_ID:-broker-context-1}
      BROKER_CONTEXT_JWKS_PATH: /run/secrets/broker-context-jwks.json
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      TLS_CERT_PATH: /run/secrets/tls/message-broker.crt
      TLS_KEY_PATH: /run/secrets/tls/message-broker.key
      # Traces to Jaeger (deploy/monitoring.md, Tracing): one span per delivery attempt, in the caller's trace.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ./secrets/gateway-assertion-jwks.json:/run/secrets/gateway-assertion-jwks.json:ro
      - ./secrets/broker-context.pem:/run/secrets/broker-context.pem:ro
      - ./secrets/broker-context-jwks.json:/run/secrets/broker-context-jwks.json:ro
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/message-broker.crt:/run/secrets/tls/message-broker.crt:ro
      - ./secrets/tls/message-broker.key:/run/secrets/tls/message-broker.key:ro
    ports:
      - "127.0.0.1:3010:3010"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3010 && printf \"GET /ready HTTP/1.0\\r\\n\\r\\n\" >&3 && timeout 2 cat <&3 | head -1 | grep -q \" 200 \"'"]
      interval: 5s
      timeout: 3s
      retries: 24

  # Discovery must return grpc_endpoint and subscriptions (service-discovery #60).
  service-discovery:
    build: ${SERVICE_DISCOVERY_SOURCE:?set SERVICE_DISCOVERY_SOURCE in .env to a service-discovery checkout}
    image: tamagotchi-go/service-discovery:candidate
    pull_policy: build

  guild:
    build: ${GUILD_SOURCE:?set GUILD_SOURCE in .env to a guild-service checkout}
    image: tamagotchi-go/guild-service:candidate
    pull_policy: build
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      GRPC_PORT: 50051
      BROKER_GRPC_ENDPOINT: message-broker:5010
      # On, Guild's calls to User Management and Package Registry and its service tokens go through the
      # broker. Turn it on only once User Management serves the broker and the broker's catalogue has
      # registry.check_eligibility.
      BROKER_CALLS_ENABLED: ${GUILD_BROKER_CALLS_ENABLED:-false}
      BROKER_CONTEXT_JWKS_PATH: /run/secrets/broker-context-jwks.json
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      TLS_CERT_PATH: /run/secrets/tls/guild.crt
      TLS_KEY_PATH: /run/secrets/tls/guild.key
    volumes:
      - ./secrets/broker-context-jwks.json:/run/secrets/broker-context-jwks.json:ro
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/guild.crt:/run/secrets/tls/guild.crt:ro
      - ./secrets/tls/guild.key:/run/secrets/tls/guild.key:ro

  registry:
    build: ${REGISTRY_SOURCE:?set REGISTRY_SOURCE in .env to a package-registry-service checkout}
    image: tamagotchi-go/package-registry-service:candidate
    pull_policy: build
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      GRPC_PORT: 50051
      BROKER_GRPC_ENDPOINT: message-broker:5010
      BROKER_CONTEXT_JWKS_PATH: /run/secrets/broker-context-jwks.json
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      # The canonical name is package-registry although the compose host is registry.
      TLS_CERT_PATH: /run/secrets/tls/package-registry.crt
      TLS_KEY_PATH: /run/secrets/tls/package-registry.key
    volumes:
      - ./secrets/broker-context-jwks.json:/run/secrets/broker-context-jwks.json:ro
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/package-registry.crt:/run/secrets/tls/package-registry.crt:ro
      - ./secrets/tls/package-registry.key:/run/secrets/tls/package-registry.key:ro

  # User Management starts first and never waits for the broker (contracts/identity.md section 5): the broker
  # reads its JWKS at startup, and its broker clients connect only when used. The delivery listener serves the
  # broker's calls into UM (its internal and public operations and users.issue_service_token).
  user-management:
    build: ${USER_MANAGEMENT_SOURCE:?set USER_MANAGEMENT_SOURCE in .env to a user-management checkout}
    image: tamagotchi-go/user-management:candidate
    pull_policy: build
    environment:
      BROKER_DELIVERY_ENABLED: "true"
      BROKER_DELIVERY_PORT: 5001
      BROKER_CONTEXT_JWKS_PATH: /run/secrets/broker-context-jwks.json
      BROKER_GRPC_TARGET: message-broker:5010
      # On (cutover step 2): UM's outbox (user.friend_request_created.v1, user.package_joined.v1) is published
      # through the broker instead of RabbitMQ. Notification, Tamagotchi and Package Registry consume both
      # topics from the broker. Set USER_MANAGEMENT_BROKER_EVENTS_ENABLED=false to go back to RabbitMQ.
      BROKER_EVENTS_ENABLED: ${USER_MANAGEMENT_BROKER_EVENTS_ENABLED:-true}
      # On, UM reads Package Registry (registry.read_package, registry.get_currency_rules) through the broker.
      BROKER_CALLS_ENABLED: ${USER_MANAGEMENT_BROKER_CALLS_ENABLED:-false}
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      TLS_CERT_PATH: /run/secrets/tls/user-management.crt
      TLS_KEY_PATH: /run/secrets/tls/user-management.key
      # Traces to Jaeger (deploy/monitoring.md, Tracing).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ./secrets/broker-context-jwks.json:/run/secrets/broker-context-jwks.json:ro
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/user-management.crt:/run/secrets/tls/user-management.crt:ro
      - ./secrets/tls/user-management.key:/run/secrets/tls/user-management.key:ro

  battle:
    build: ${BATTLE_SOURCE:?set BATTLE_SOURCE in .env to a battle checkout}
    image: tamagotchi-go/battle:candidate
    pull_policy: build
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      BROKER_DELIVERY_ENABLED: "true"
      BROKER_DELIVERY_PORT: 5001
      BROKER_CONTEXT_JWKS_PATH: /run/secrets/broker-context-jwks.json
      BROKER_GRPC_TARGET: message-broker:5010
      # Off until the cutover step: on, Battle's outbox is published through the broker instead of RabbitMQ.
      BROKER_EVENTS_ENABLED: ${BATTLE_BROKER_EVENTS_ENABLED:-false}
      # On (cutover): one switch for all of Battle's calls, to User Management, Package Registry and Tamagotchi
      # (only the type matrix stays on the Gateway). Tamagotchi serves the broker (BROKER_DELIVERY below).
      # Set BATTLE_BROKER_CALLS_ENABLED=false to call them directly again.
      BROKER_CALLS_ENABLED: ${BATTLE_BROKER_CALLS_ENABLED:-true}
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      TLS_CERT_PATH: /run/secrets/tls/battle.crt
      TLS_KEY_PATH: /run/secrets/tls/battle.key
      # Traces to Jaeger (deploy/monitoring.md, Tracing).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ./secrets/broker-context-jwks.json:/run/secrets/broker-context-jwks.json:ro
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/battle.crt:/run/secrets/tls/battle.crt:ro
      - ./secrets/tls/battle.key:/run/secrets/tls/battle.key:ro

  tamagotchi:
    build: ${TAMAGOTCHI_SOURCE:?set TAMAGOTCHI_SOURCE in .env to a tamagotchi checkout}
    image: tamagotchi-go/tamagotchi:candidate
    pull_policy: build
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      BROKER_DELIVERY: "true"
      GRPC_PORT: 50051
      BROKER_PUBLISH: ${TAMAGOTCHI_BROKER_PUBLISH:-false}
      BROKER_CALLS: ${TAMAGOTCHI_BROKER_CALLS:-false}
      BROKER_GRPC_TARGET: message-broker:5010
      BROKER_CONTEXT_JWKS_PATH: /run/secrets/broker-context-jwks.json
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      TLS_CERT_PATH: /run/secrets/tls/tamagotchi.crt
      TLS_KEY_PATH: /run/secrets/tls/tamagotchi.key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ./secrets/broker-context-jwks.json:/run/secrets/broker-context-jwks.json:ro
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/tamagotchi.crt:/run/secrets/tls/tamagotchi.crt:ro
      - ./secrets/tls/tamagotchi.key:/run/secrets/tls/tamagotchi.key:ro

  notification:
    build: ${NOTIFICATION_SOURCE:?set NOTIFICATION_SOURCE in .env to a notifications checkout}
    image: tamagotchi-go/notification:candidate
    pull_policy: build
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      BROKER_DELIVERY: "true"
      GRPC_PORT: 50051
      BROKER_CONTEXT_JWKS_PATH: /run/secrets/broker-context-jwks.json
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      TLS_CERT_PATH: /run/secrets/tls/notification.crt
      TLS_KEY_PATH: /run/secrets/tls/notification.key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ./secrets/broker-context-jwks.json:/run/secrets/broker-context-jwks.json:ro
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/notification.crt:/run/secrets/tls/notification.crt:ro
      - ./secrets/tls/notification.key:/run/secrets/tls/notification.key:ro

  # Map 4.0.0 source requires Broker transport; older published Map pins stay in compose.yaml.
  map:
    build: ${MAP_SOURCE:?set MAP_SOURCE in .env to a map checkout}
    image: tamagotchi-go/map:candidate
    pull_policy: build
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      BROKER_DELIVERY: "true"
      BROKER_URL: https://message-broker:5010
      GRPC_PORT: 5010
      BROKER_CONTEXT_JWKS_PATH: /run/secrets/broker-context-jwks.json
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      TLS_CERT_PATH: /run/secrets/tls/map.crt
      TLS_KEY_PATH: /run/secrets/tls/map.key
      # Retained outbox rows are published through Broker only, never RabbitMQ.
      RABBITMQ_URL: ""
    volumes:
      - ./secrets/broker-context-jwks.json:/run/secrets/broker-context-jwks.json:ro
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/map.crt:/run/secrets/tls/map.crt:ro
      - ./secrets/tls/map.key:/run/secrets/tls/map.key:ro

  gateway:
    build: ${GATEWAY_SOURCE:?set GATEWAY_SOURCE in .env to a gateway checkout}
    image: tamagotchi-go/gateway:candidate
    pull_policy: build
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      BROKER_DISPATCH: ${GATEWAY_BROKER_DISPATCH:-false}
      BROKER_GRPC_TARGET: message-broker:5010
      TLS_CA_PATH: /run/secrets/tls/ca.crt
      TLS_CERT_PATH: /run/secrets/tls/gateway.crt
      TLS_KEY_PATH: /run/secrets/tls/gateway.key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ./secrets/tls/ca.crt:/run/secrets/tls/ca.crt:ro
      - ./secrets/tls/gateway.crt:/run/secrets/tls/gateway.crt:ro
      - ./secrets/tls/gateway.key:/run/secrets/tls/gateway.key:ro

  # Traces from the services that set OTEL_EXPORTER_OTLP_ENDPOINT (deploy/monitoring.md, Tracing).
  # Memory only; the UI is on loopback, OTLP only on the Compose network.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 768m

volumes:
  broker-postgres-data:
