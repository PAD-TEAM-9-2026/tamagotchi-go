syntax = "proto3";

package tamagotchi.messaging.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.tamagotchigo.contracts.messaging.v1";
option csharp_namespace = "Tamagotchi.Contracts.Messaging.V1";

// Proposal: transport only. No messaging implementation or migration is implied.
service MessageBroker {
  rpc Call(CallRequest) returns (CallReply);
  rpc Publish(PublishRequest) returns (PublishReceipt);
}

// Implemented by each service around its existing application handlers.
service ServiceDelivery {
  rpc Execute(ExecuteRequest) returns (CallReply);
  rpc Deliver(EventDelivery) returns (DeliveryReply);
}

message Header {
  string name = 1;
  string value = 2;
}

message RequestContext {
  string correlation_id = 1;
  int64 deadline_unix_ms = 2;
}

message CallRequest {
  string message_id = 1;
  string destination = 2;
  string operation = 3;
  RequestContext context = 4;
  optional string idempotency_key = 5;
  oneof payload {
    PublicHttpRequest public_http = 6;
    google.protobuf.Any internal_request = 7;
  }
}

message PublicHttpRequest {
  string method = 1;
  string path = 2;
  string query = 3;
  repeated Header headers = 4;
  bytes body = 5;
}

message HttpReply {
  int32 status = 1;
  repeated Header headers = 2;
  bytes body = 3;
}

message CallFailure {
  string code = 1;
  int32 http_status = 2;
  string detail = 3;
}

message CallReply {
  string message_id = 1;
  string correlation_id = 2;
  oneof outcome {
    HttpReply public_http = 3;
    google.protobuf.Any internal_response = 4;
    CallFailure failure = 5;
  }
}

message ExecuteRequest {
  CallRequest request = 1;
  // Instance selection belongs to the broker; clients cannot nominate a target.
  string selected_instance_id = 2;
}

message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string producer = 4;
  string correlation_id = 5;
  // Existing event `data`, encoded as UTF-8 JSON. Not the whole envelope.
  bytes data_json = 6;
}

message PublishRequest {
  string topic = 1;
  EventEnvelope event = 2;
}

message PublishReceipt {
  string event_id = 1;
  google.protobuf.Timestamp accepted_at = 2;
}

message EventDelivery {
  string delivery_id = 1;
  string subscription_id = 2;
  uint32 attempt = 3;
  EventEnvelope event = 4;
}

message DeliveryReply {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    APPLIED = 1;
    DUPLICATE = 2;
    RETRYABLE_FAILURE = 3;
    PERMANENT_FAILURE = 4;
    // Refused before handler execution; no effects and no handler attempt.
    DEFERRED = 5;
  }
  Outcome outcome = 1;
  // Stable bounded machine code, never raw exception/payload contents.
  string reason_code = 2;
}
