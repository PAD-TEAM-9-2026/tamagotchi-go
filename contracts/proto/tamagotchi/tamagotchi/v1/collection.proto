syntax = "proto3";

package tamagotchi.tamagotchi.v1;

option java_multiple_files = true;
option java_package = "com.tamagotchigo.contracts.tamagotchi.v1";
option csharp_namespace = "Tamagotchi.Contracts.Tamagotchi.V1";

import "tamagotchi/tamagotchi/v1/creature.proto";
import "google/protobuf/timestamp.proto";

message GetCollectionRequest {
  string user_id = 1;
  uint32 limit = 2;
  optional string cursor = 3;
}

message GetCollectionReply {
  string user_id = 1;
  Creature primary = 2;
  repeated Creature secondary = 3;
  optional string next_cursor = 4;
  google.protobuf.Timestamp retrieved_at = 5;
}
